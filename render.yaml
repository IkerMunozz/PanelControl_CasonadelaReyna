services:
  - type: web
    name: casona-whatsapp-dashboard-backend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && mkdir -p ../backend/frontend-dist && rm -rf ../backend/frontend-dist/* && cp -r dist/* ../backend/frontend-dist/ && cd ../backend && npm install && npm run build
    startCommand: cd backend && node dist/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: N8N_SEND_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
